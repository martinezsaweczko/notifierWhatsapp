basePath: /api/v1
definitions:
  model.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  model.HTTPError:
    properties:
      message:
        type: string
    type: object
  model.HealthInfo:
    properties:
      status:
        type: string
      timestamp:
        type: string
    type: object
  model.NotificationRequest:
    properties:
      message:
        type: string
      recipient:
        type: string
    type: object
  model.NotificationResponse:
    properties:
      message_id:
        type: string
      status:
        type: string
    type: object
  model.VersionInfo:
    properties:
      appName:
        type: string
      buildTime:
        type: string
      version:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for sending WhatsApp notifications.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: WhatsApp Notifier API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Get health status of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.HTTPError'
      summary: Get health status
      tags:
      - health
  /notifications:
    post:
      consumes:
      - application/json
      parameters:
      - description: Notification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.NotificationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/model.NotificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Send a WhatsApp notification
      tags:
      - notifications
  /version:
    get:
      consumes:
      - application/json
      description: Get version information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.VersionInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.HTTPError'
      summary: Get version information
      tags:
      - version
swagger: "2.0"
